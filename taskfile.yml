version: '3'
vars:
  APP_NAME: "cutter"
  # ./VERSION holds a bare semver (e.g. 0.2.0); the "v" prefix is added here
  # and the file is read as-is by flake.nix.
  APP_VERSION:
    sh: echo "v$(cat VERSION)"
  RELEASE_DIR: "./.release"
  BUILD_TARGET: "./{{.APP_NAME}}"
tasks:
  run:
    cmds:
      - go run main.go
    silent: true
  check:
    cmds:
      - staticcheck ./...
  tidy:
    cmds:
      - go mod tidy
  lint:
    deps: [check, tidy]
  build:
    requires:
      vars: [BUILD_TARGET]
    cmds:
      - go build -v -ldflags "-X github.com/oschrenk/cutter/cmd.version={{.APP_VERSION}}" -o "{{.BUILD_TARGET}}"
    silent: true
  test:
    cmds:
      - go test ./...
    silent: true
  install:
    cmds:
      - go install -ldflags "-X github.com/oschrenk/cutter/cmd.version={{.APP_VERSION}}"
    silent: true
  uninstall:
    cmds:
      - rm -f ${GOBIN}/{{.APP_NAME}}
    silent: true
  artifacts:
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    cmds:
      - mkdir -p {{.RELEASE_DIR}}
      - GOOS=darwin GOARCH=arm64 go build -v -ldflags "-X github.com/oschrenk/cutter/cmd.version={{.APP_VERSION}}" -o {{.RELEASE_DIR}}/{{.APP_NAME}}-darwin-arm64
    deps: [tidy]
  tag:
    deps: [artifacts]
    cmds:
      - git tag "{{.APP_VERSION}}"
      - git push origin "{{.APP_VERSION}}"
  release:
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    deps: [tag]
    cmds:
      - gh release create --generate-notes "{{.APP_VERSION}}" {{.RELEASE_DIR}}/{{.APP_NAME}}-*
  sha:
    requires:
      vars: [APP_NAME, RELEASE_DIR]
    cmds:
      - sha256sum {{.RELEASE_DIR}}/{{.APP_NAME}}-*
  clean:
    requires:
      vars: [BUILD_TARGET, RELEASE_DIR]
    cmds:
      - rm -rf {{.BUILD_TARGET}}
      - rm -rf {{.RELEASE_DIR}}
  updates:
    # {{` `}} is to escape go templating from go task
    cmds:
      - "go list -u -f '{{`{{if (and (not (or .Main .Indirect)) .Update)}}{{.Path}}: {{.Version}} -> {{.Update.Version}}{{end}}`}}' -m all 2> /dev/null"
